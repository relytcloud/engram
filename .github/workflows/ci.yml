name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.10"

      - name: Run unit tests
        run: go test ./...

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.10"

      - name: Run e2e tests
        run: go test -tags e2e ./internal/server/...

  plugin-version:
    name: Plugin Version Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # A partial bump is the common failure: `claude plugin update` keys off the
      # marketplace entry alone, so a stale plugin.json goes unnoticed until
      # someone reads the installed manifest.
      - name: Check plugin manifests agree on a version
        run: ./tools/check-plugin-version.sh
